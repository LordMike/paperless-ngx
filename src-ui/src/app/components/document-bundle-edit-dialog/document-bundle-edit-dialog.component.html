<form [formGroup]="bundleForm" (ngSubmit)="save()" autocomplete="off">
  <div class="modal-header">
    <h4 class="modal-title" i18n>Edit bundle</h4>
    @if (bundle?.id) {
      <span class="badge bg-primary text-primary-text-contrast ms-2">ID: {{bundle.id}}</span>
    }
    <button type="button" [disabled]="!closeEnabled" class="btn-close" aria-label="Close" (click)="close()"></button>
  </div>
  <div class="modal-body">
    <div class="mb-3">
      <label class="form-label" for="bundleId" i18n>Bundle ID</label>
      <input id="bundleId" class="form-control" formControlName="bundle_id" autocomplete="off">
    </div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-outline-secondary" (click)="close()" i18n>Cancel</button>
    <button type="submit" class="btn btn-primary" i18n>Save</button>
  </div>
</form>
