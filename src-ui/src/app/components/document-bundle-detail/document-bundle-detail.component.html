<pngx-page-header [title]="bundle ? 'Bundle ' + bundle.bundle_id : 'Bundle'">
  <button type="button" class="btn btn-sm btn-outline-danger" (click)="deleteBundle()" [disabled]="!bundle">
    <i-bs name="trash" class="me-1"></i-bs><ng-container i18n>Delete bundle</ng-container>
  </button>
</pngx-page-header>

@if (bundle) {
  <div class="mb-3 d-flex flex-wrap gap-2 align-items-end">
    <div>
      <label class="form-label" for="bundleAddDocument" i18n>Document ID</label>
      <input id="bundleAddDocument" class="form-control form-control-sm" type="number" min="1" [(ngModel)]="addDocumentId">
    </div>
    <button type="button" class="btn btn-sm btn-outline-primary" (click)="addDocument()" [disabled]="!addDocumentId">
      <i-bs name="plus-lg" class="me-1"></i-bs><ng-container i18n>Add document</ng-container>
    </button>
    <button type="button" class="btn btn-sm btn-outline-primary ms-auto" (click)="saveOrder()">
      <i-bs name="sort-numeric-down" class="me-1"></i-bs><ng-container i18n>Save order</ng-container>
    </button>
  </div>

  <div class="table-responsive">
    <table class="table table-sm align-middle border shadow-sm">
      <thead>
        <tr>
          <th i18n>Order</th>
          <th i18n>Name</th>
          <th i18n>Document</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        @for (item of bundle.items; track item.id) {
          <tr>
            <td style="width: 8rem;">
              <input class="form-control form-control-sm" type="number" min="1" [(ngModel)]="orderEdits[item.id]">
            </td>
            <td>{{item.bundle_item_name}}</td>
            <td>
              <a routerLink="/documents/{{item.document}}">{{item.document_title || item.document}}</a>
            </td>
            <td class="text-end">
              <div class="btn-group btn-group-sm">
                <button type="button" class="btn btn-outline-secondary" i18n-title title="Open document" (click)="openDocument(item)">
                  <i-bs name="box-arrow-up-right"></i-bs>
                </button>
                <button type="button" class="btn btn-outline-secondary" i18n-title title="Edit name" (click)="editName(item)">
                  <i-bs name="pencil"></i-bs>
                </button>
                <button type="button" class="btn btn-outline-danger" i18n-title title="Remove from bundle" (click)="remove(item)">
                  <i-bs name="x"></i-bs>
                </button>
              </div>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
}
